# =============================================================================
# EXAMPLE — not active until you copy it to .github/workflows/deploy.yml
# (docs/DEPLOY.md, step 14). The CDK app it deploys is synth-tested only.
#
#   push to main  -> test -> deploy dev (no approval)
#                         -> deploy prod (waits for your approval in GitHub)
#   Actions -> deploy -> Run workflow -> stage: prod   redeploys prod from a branch
#   Re-run an older run's "deploy-prod" job             rolls prod back to that commit
#
# AWS access is GitHub OIDC -> the github-deploy-<env> role in each account
# (GithubOidc-<stage> stack). No AWS keys are stored in GitHub.
#
# GitHub settings (Settings -> Environments), per environment:
#   dev:        variable AWS_DEPLOY_ROLE_ARN (dev account), secret ALERT_EMAIL
#   production: variable AWS_DEPLOY_ROLE_ARN (prod account), secret ALERT_EMAIL,
#               "Required reviewers" = you, "Deployment branches" = main
# Pin actions to commit SHAs before real use.
# =============================================================================
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to deploy"
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write   # OIDC
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: food-nutrition-app } }
    steps:
      - uses: actions/checkout@v7
        with: { lfs: true }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: food-nutrition-app/package-lock.json }
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run check   # lint + typecheck + test + build, same as CI

  deploy-dev:
    needs: test
    if: github.event_name == 'push' || inputs.stage == 'dev'
    # arm64 runner so the image builds natively for Lambda arm64.
    runs-on: ubuntu-24.04-arm
    environment: dev
    concurrency: { group: deploy-dev, cancel-in-progress: false }
    env:
      STAGE: dev
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v7
        with: { lfs: true }   # nutrition.db is baked into the image
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: docs/aws/infra-example/cdk/package-lock.json }
      - name: Check settings
        run: |
          [ -n "$ALERT_EMAIL" ] || { echo "::error::Add the ALERT_EMAIL secret to the dev environment (docs/DEPLOY.md, step 13)"; exit 1; }
          [ -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ] || { echo "::error::Add the AWS_DEPLOY_ROLE_ARN variable to the dev environment"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: CDK deploy (DNS stack first, then the site)
        working-directory: docs/aws/infra-example/cdk
        run: |
          npm ci --no-audit --no-fund
          npx cdk deploy "NutritionDictionary-${STAGE}" -c stage="${STAGE}" \
            --require-approval never --outputs-file "$RUNNER_TEMP/outputs.json"
      - name: Smoke test
        run: |
          URL="$(node -p "require(process.env.RUNNER_TEMP + '/outputs.json')['NutritionDictionary-${STAGE}'].SiteUrl")"
          echo "Testing $URL"
          node food-nutrition-app/scripts/smoke.mjs "$URL" --wait 120

  deploy-prod:
    needs: [test, deploy-dev]
    # On a push, after dev succeeded. From "Run workflow", whenever stage = prod.
    if: >-
      !cancelled() && needs.test.result == 'success' &&
      ((github.event_name == 'push' && needs.deploy-dev.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.stage == 'prod'))
    runs-on: ubuntu-24.04-arm
    environment: production   # pauses here until you approve (required reviewer)
    concurrency: { group: deploy-prod, cancel-in-progress: false }
    env:
      STAGE: prod
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v7
        with: { lfs: true }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: docs/aws/infra-example/cdk/package-lock.json }
      - name: Check settings
        run: |
          [ -n "$ALERT_EMAIL" ] || { echo "::error::Add the ALERT_EMAIL secret to the production environment (docs/DEPLOY.md, step 13)"; exit 1; }
          [ -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ] || { echo "::error::Add the AWS_DEPLOY_ROLE_ARN variable to the production environment"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: CDK deploy (DNS stack first, then the site)
        working-directory: docs/aws/infra-example/cdk
        run: |
          npm ci --no-audit --no-fund
          npx cdk deploy "NutritionDictionary-${STAGE}" -c stage="${STAGE}" \
            --require-approval never --outputs-file "$RUNNER_TEMP/outputs.json"
      - name: Smoke test
        run: |
          URL="$(node -p "require(process.env.RUNNER_TEMP + '/outputs.json')['NutritionDictionary-${STAGE}'].SiteUrl")"
          echo "Testing $URL"
          node food-nutrition-app/scripts/smoke.mjs "$URL" --wait 120
