name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: food-nutrition-app
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      # nutrition.db lives in Git LFS. Cache the LFS object so repeat runs
      # don't spend the repo's LFS bandwidth quota.
      - name: Compute LFS cache key
        working-directory: .
        run: git lfs ls-files --long --include=food-nutrition-app/nutrition.db | cut -d' ' -f1 > .lfs-assets-id
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Fetch database (Git LFS)
        working-directory: .
        run: git lfs pull --include=food-nutrition-app/nutrition.db
      - name: Verify database is not an LFS pointer
        run: |
          test "$(head -c 15 nutrition.db)" = "SQLite format 3" || { echo "::error::nutrition.db is an LFS pointer"; exit 1; }

      # Node 26 (current LTS), from .nvmrc; Dockerfile, Dockerfile.lambda use the same.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: food-nutrition-app/package-lock.json

      # better-sqlite3 ships N-API prebuilds; skip the node-gyp fallback
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run lint
      - name: Type check
        run: npm run typecheck # next typegen && tsc --noEmit
      - run: npm test --if-present
      - name: Build (standalone)
        run: npm run build

      # Same smoke test the local guide uses (docs/LOCAL_TESTING.md): page,
      # /api/meta, /api/search, POST /api/optimize. Run from another cwd.
      - name: Smoke test standalone server
        run: |
          cp -r .next/static .next/standalone/.next/static
          cd /tmp
          PORT=3300 HOSTNAME=127.0.0.1 node "$GITHUB_WORKSPACE/food-nutrition-app/.next/standalone/server.js" &
          node "$GITHUB_WORKSPACE/food-nutrition-app/scripts/smoke.mjs" http://127.0.0.1:3300 --wait 30
          du -sh "$GITHUB_WORKSPACE/food-nutrition-app/.next/standalone"

  docker:
    name: Docker image (build, health check, smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Build image
        run: docker build -t nanonutrition:ci .
      - name: Run and wait for HEALTHCHECK
        run: |
          docker run -d --name nanonutrition-ci -p 3000:3000 --health-interval 2s nanonutrition:ci
          for i in $(seq 1 30); do
            s="$(docker inspect -f '{{.State.Health.Status}}' nanonutrition-ci)"; echo "health: $s"
            [ "$s" = healthy ] && break; sleep 2
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' nanonutrition-ci)" = healthy ] || { docker logs nanonutrition-ci; exit 1; }
      - name: Smoke test
        run: node food-nutrition-app/scripts/smoke.mjs http://127.0.0.1:3000 --wait 30
      - if: always()
        run: docker rm -f nanonutrition-ci || true

  cdk-synth:
    name: AWS CDK example (typecheck + synth, no AWS account)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs/aws/infra-example/cdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs/aws/infra-example/cdk/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # Synth only stages the Docker build context; it doesn't need Docker,
      # credentials or the LFS database.
      - run: npx cdk synth --quiet && npx cdk synth --quiet -c stage=prod
