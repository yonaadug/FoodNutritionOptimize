# =============================================================================
# EXAMPLE — never run. Copy to .github/workflows/deploy.yml and adapt.
# The CDK app it deploys is synth-tested only (see docs/LOCAL_TESTING.md).
# GitHub OIDC -> AWS (no long-lived keys). See docs/aws/AWS_HOSTING_DESIGN.md §3.11.
#
# Repo settings required:
#   Environments: `dev` (no approval) and `production` (required reviewer = you).
#   Environment variables: AWS_DEPLOY_ROLE_ARN, ARTIFACTS_BUCKET (per environment).
# Pin actions to commit SHAs before real use.
# =============================================================================
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to deploy"
        type: choice
        options: [dev, prod]
        default: prod

permissions:
  id-token: write   # OIDC
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.stage || 'dev' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: food-nutrition-app } }
    steps:
      - uses: actions/checkout@v7
        with: { lfs: true }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: food-nutrition-app/package-lock.json }
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run check   # lint + typecheck + test + build, same as CI

  deploy:
    needs: test
    # arm64 runner so the image builds natively for Lambda arm64.
    # (Fallback: ubuntu-latest + docker/setup-qemu-action@v4, much slower.)
    runs-on: ubuntu-24.04-arm
    environment: ${{ (github.event.inputs.stage || 'dev') == 'prod' && 'production' || 'dev' }}
    env:
      STAGE: ${{ github.event.inputs.stage || 'dev' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: docs/aws/infra-example/cdk/package-lock.json }

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch pinned nutrition DB artifact
        working-directory: food-nutrition-app
        run: |
          VERSION="$(cat nutrition-db.version)"
          aws s3 cp "s3://${{ vars.ARTIFACTS_BUCKET }}/nutrition-db/${VERSION}/nutrition.db" nutrition.db
          aws s3 cp "s3://${{ vars.ARTIFACTS_BUCKET }}/nutrition-db/${VERSION}/nutrition.db.sha256" nutrition.db.sha256
          sha256sum -c nutrition.db.sha256

      - name: CDK deploy
        working-directory: docs/aws/infra-example/cdk   # move to infra/ when adopting
        run: |
          npm ci --no-audit --no-fund
          npx cdk deploy "MicronutrientDiary-${STAGE}" -c stage="${STAGE}" --require-approval never

      - name: Smoke test
        run: |
          URL="$(aws cloudformation describe-stacks --stack-name "MicronutrientDiary-${STAGE}" \
                 --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue" --output text)"
          # GET-only checks: through CloudFront OAC, POST /api/optimize needs the
          # x-amz-content-sha256 header (see the stack's Function URL notes).
          curl -fsS "${URL}/api/meta"
          curl -fsS "${URL}/api/search?q=salmon&limit=5" | head -c 300
